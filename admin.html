<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AS Global Management — Admin Dashboard</title>
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #059669;
      --primary-dark: #064e3b;
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --danger: #dc2626;
      --white: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f8fafc; color: var(--slate-900); min-height: 100vh; }

    /* Auth Card (Shown when logged out) */
    #auth-view {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .login-card {
      background: var(--white);
      max-width: 400px;
      width: 100%;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--slate-200);
      text-align: center;
    }
    .login-card h2 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 8px; color: var(--primary-dark); }
    .login-card p { font-size: 0.85rem; color: #64748b; margin-bottom: 24px; }
    
    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 6px; color: var(--slate-700); }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--slate-200);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    .form-group input:focus { border-color: var(--primary); }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: var(--white);
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn.logout-btn { width: auto; padding: 8px 16px; font-size: 0.85rem; background: var(--slate-700); }

    .error-msg {
      background: #fee2e2;
      color: var(--danger);
      font-size: 0.82rem;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
      font-weight: 600;
    }

    /* Dashboard Header & Content (Shown when logged in) */
    #dashboard-view { display: none; padding-bottom: 60px; }
    .dash-header {
      background: var(--white);
      border-bottom: 1px solid var(--slate-200);
      padding: 16px clamp(16px, 3vw, 32px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dash-header h1 { font-size: 1.25rem; font-family: 'Space Grotesk', sans-serif; color: var(--primary-dark); }
    
    .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
    
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: 12px;
      padding: 18px;
    }
    .stat-card span { font-size: 0.8rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .stat-card b { display: block; font-size: 1.8rem; font-family: 'Space Grotesk', sans-serif; color: var(--slate-900); }

    .table-card {
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    th { background: var(--slate-100); padding: 12px 16px; font-weight: 700; color: var(--slate-700); }
    td { padding: 14px 16px; border-top: 1px solid var(--slate-200); }
    tr:hover { background: #f8fafc; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #ecfdf5;
      color: var(--primary-dark);
    }
  </style>
</head>
<body>

  <!-- 1. LOGIN VIEW -->
  <div id="auth-view">
    <div class="login-card">
      <h2>Admin Login</h2>
      <p>AS Global Management Management Portal</p>
      
      <div id="login-error" class="error-msg"></div>

      <form onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label>Admin Email</label>
          <input type="email" id="admin-email" placeholder="admin@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="admin-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn" id="login-btn">Secure Login →</button>
      </form>
    </div>
  </div>

  <!-- 2. SECURE DASHBOARD VIEW -->
  <div id="dashboard-view">
    <header class="dash-header">
      <div>
        <h1>AS GLOBAL MANAGEMENT</h1>
        <small style="color: #64748b;">Live Booking Dispatch Engine</small>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span id="user-display" style="font-size: 0.82rem; font-weight: 600; color: var(--slate-700);"></span>
        <button class="btn logout-btn" onclick="handleLogout()">Sign Out</button>
      </div>
    </header>

    <main class="container">
      <div class="stats-row">
        <div class="stat-card">
          <span>Total Bookings</span>
          <b id="stat-total">0</b>
        </div>
        <div class="stat-card">
          <span>Expected Revenue</span>
          <b id="stat-revenue" style="color: var(--primary);">₹0</b>
        </div>
      </div>

      <div class="table-card">
        <div style="padding: 16px; border-bottom: 1px solid var(--slate-200); display: flex; justify-content: space-between; align-items: center;">
          <h2 style="font-size: 1.1rem; font-family: 'Space Grotesk';">Customer Bookings</h2>
          <button class="btn" style="width: auto; padding: 6px 14px; font-size: 0.82rem;" onclick="loadBookings()">↻ Refresh</button>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Booking Ref</th>
                <th>Customer</th>
                <th>Phone</th>
                <th>Treatments</th>
                <th>Arrival Slot</th>
                <th>Total</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="bookings-table-body">
              <tr>
                <td colspan="7" style="text-align: center; color: #94a3b8; padding: 24px;">Loading bookings...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Exact Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCjhGH7znn0F6QV_EmRVOxfVUbJLe6E8hI",
      authDomain: "as-global-management.firebaseapp.com",
      projectId: "as-global-management",
      storageBucket: "as-global-management.firebasestorage.app",
      messagingSenderId: "733475933170",
      appId: "1:733475933170:web:41c763502d6adc5ddaf96b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Escape customer input to prevent XSS
    function escapeHTML(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Monitor Authentication State
    auth.onAuthStateChanged(user => {
      const authView = document.getElementById("auth-view");
      const dashView = document.getElementById("dashboard-view");

      if (user) {
        authView.style.display = "none";
        dashView.style.display = "block";
        document.getElementById("user-display").textContent = user.email;
        loadBookings();
      } else {
        authView.style.display = "flex";
        dashView.style.display = "none";
      }
    });

    // Handle Login
    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById("admin-email").value.trim();
      const pass = document.getElementById("admin-password").value;
      const errBox = document.getElementById("login-error");
      const btn = document.getElementById("login-btn");

      errBox.style.display = "none";
      btn.textContent = "Verifying...";
      btn.disabled = true;

      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch (err) {
         errBox.textContent = err.code + " — " + err.message;
        errBox.style.display = "block";
      } finally {
        btn.textContent = "Secure Login →";
        btn.disabled = false;
      }
    }

    // Handle Logout
    function handleLogout() {
      auth.signOut();
    }

    // Fetch and render bookings from Firestore
    async function loadBookings() {
      const tbody = document.getElementById("bookings-table-body");
      try {
        const snapshot = await db.collection("bookings").get();
        
        let totalRev = 0;
        let count = 0;
        let rowsHtml = "";

        if (snapshot.empty) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 24px; color: #94a3b8;">No customer bookings recorded yet.</td></tr>`;
          document.getElementById("stat-total").textContent = "0";
          document.getElementById("stat-revenue").textContent = "₹0";
          return;
        }

        snapshot.forEach(doc => {
          const b = doc.data();
          count++;
          totalRev += Number(b.total || 0);

          rowsHtml += `
            <tr>
              <td><b>${escapeHTML(b.ref || doc.id)}</b></td>
              <td>${escapeHTML(b.name)}<br><small style="color:#64748b;">${escapeHTML(b.address)}</small></td>
              <td><a href="tel:${escapeHTML(b.phone)}" style="color:var(--primary); font-weight:700;">${escapeHTML(b.phone)}</a></td>
              <td>${escapeHTML(b.services)}</td>
              <td>${escapeHTML(b.date)}<br><small style="color:#64748b;">${escapeHTML(b.slot)}</small></td>
              <td><b>₹${Number(b.total || 0).toLocaleString('en-IN')}</b></td>
              <td><span class="badge">${escapeHTML(b.status || 'Confirmed')}</span></td>
            </tr>
          `;
        });

        tbody.innerHTML = rowsHtml;
        document.getElementById("stat-total").textContent = count;
        document.getElementById("stat-revenue").textContent = "₹" + totalRev.toLocaleString('en-IN');
      } catch (err) {
        console.error("Failed to load bookings:", err);
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: red; padding: 24px;">Permission Denied. Only authorized admin can view records.</td></tr>`;
      }
    }
  </script>
</body>
</html>
